<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulaire</title>
    <link rel="stylesheet" href="./assets/css/regex-form.css">
    <script src="./assets/js/regex.js" defer></script>
</head>
<body>
    <h1>Expressions régulières</h1>
    <h2>Contrôle de saisie</h2>
    <fieldset>
        <legend>formulaire d'inscription</legend>
        <form action="" method="get" enctype="application/x-www-form-urlencoded">
            <div>
                <label for="myName">Nom</label>
                <input type="text" name="myName" id="myName" placeholder="votre nom" required>
            </div>
            <div>
                <label for="myBirthDate">Date de naissance</label>
                <input type="date" name="myBirthDate" id="myBirthDate" value="1970-01-01" required>
            </div>
            <div>
                <label for="myPhone">Téléphone</label>
                <select name="indicatif">
                    <option value="1">+1</option>
                    <option value="32">+32</option>
                    <option value="33">+33</option>
                    <option value="41">+41</option>
                </select>
                <input type="tel" name="myPhone" id="myPhone" placeholder="ex: 0102030405" value="06.02.03 04 05" required>
            </div>
            <div>
                <label for="myPassword1">Mot de passe</label>
                <input type="password" name="myPassword1" id="myPassword1" required>
            </div>
            <div>
                <label for="myPassword2">Confirmez Mot de passe</label>
                <input type="password" name="myPassword2" id="myPassword2" required>
            </div>
            <div>
                <button type="submit" id="valider">Valider</button>
            </div>
        </form>
    </fieldset>
</body>
</html>
